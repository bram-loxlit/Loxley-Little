<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loxley & Little | Welcome</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #aaaaaa;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333333;
            background-color: #2a2a2a;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus {
            border-color: #ffffff;
        }

        button {
            padding: 12px;
            border-radius: 6px;
            border: none;
            background-color: #ffffff;
            color: #121212;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        .footer-links {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #888888;
            line-height: 1.5;
        }

        .footer-links a {
            color: #ffffff;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .footer-links a:hover {
            color: #cccccc;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Central Logo -->
        <img src="Loxley & Little White.png" alt="Loxley & Little Logo" class="logo">

        <!-- Login Form -->
        <form action="#" method="POST">
            <div class="input-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit">Log In</button>
        </form>

        <!-- Subscription / Contact Link -->
        <div class="footer-links">
            <p>Don't have an account?</p>
            <p><a href="mailto:info@loxlit.com?subject=Subscription%20Request%20for%20Login%20Info">Request login access via email</a></p>
        </div>
    </div>

</body>
</html>
